name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies only: the game ships its runtime packages, while dev
      # tooling (jest, webpack-dev-server) never reaches the browser.
      - name: Dependency audit (high and above in production dependencies blocks)
        run: npm audit --omit=dev --audit-level=high
      - run: npx jest
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The action's bundled wrangler predates assets-only Workers, so run a pinned one.
        run: npx --yes wrangler@4.156.0 deploy
