name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * 0'
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check London midnight
        id: midnight
        run: node scripts/london-midnight.js "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.midnight.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.midnight.outputs.deploy == 'true'
      # Production dependencies only: the game ships its runtime packages, while dev
      # tooling (jest, webpack-dev-server) never reaches the browser.
      - name: Dependency audit (high and above in production dependencies blocks)
        if: steps.midnight.outputs.deploy == 'true'
        run: npm audit --omit=dev --audit-level=high
      - run: npx jest
        if: steps.midnight.outputs.deploy == 'true'
      - run: npm run build
        if: steps.midnight.outputs.deploy == 'true'
      - run: npm run build-world
        id: world
        if: steps.midnight.outputs.deploy == 'true'
      - name: Upload weekly world to R2
        if: steps.midnight.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORLD_KEY: ${{ steps.world.outputs.key }}
          WORLD_FILE: ${{ steps.world.outputs.file }}
        run: npx --yes wrangler@4.156.0 r2 object put "tinyking-worlds/$WORLD_KEY" --file "$WORLD_FILE" --content-type application/gzip --remote
      - name: Deploy to Cloudflare
        if: steps.midnight.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Use the same pinned Wrangler for the Worker and the R2 upload.
        run: npx --yes wrangler@4.156.0 deploy
